name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish
        run: dotnet publish Awp_only.csproj -c Release -o out

      - name: Package
        run: |
          mkdir -p pkg/Awp_only
          cp out/Awp_only.dll out/Awp_only.deps.json config.cfg pkg/Awp_only/

      - uses: actions/upload-artifact@v4
        with:
          name: Awp_only
          path: pkg
